name: Daily refresh

on:
  schedule:
    - cron: '17 0,12 * * *'   # 05:47 and 17:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/schemes.json'
      - 'data/contests.json'
      - 'data/careers.json'
      - 'data/tips.json'
      - '.github/workflows/daily-refresh.yml'

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pull fresh news and videos
        run: node scripts/refresh.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Build pages, sitemap, feed and search index
        run: node scripts/build.mjs
      - name: Commit and push
        run: |
          git config user.name "bharat-loan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily refresh $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git pull --rebase --autostash origin main || true
          git push
