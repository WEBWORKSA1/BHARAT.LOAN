name: Refresh & publish (GitHub Pages)

on:
  schedule:
    - cron: '17 0,12 * * *'   # 05:47 and 17:47 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pull fresh news and videos
        run: node scripts/refresh.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Build pages, sitemap, feed and search index
        run: node scripts/build.mjs
      - name: Record GitHub Pages status
        run: |
          curl -s -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" > data/pages-status.json || true
      - name: Commit and push
        run: |
          git config user.name "bharat-loan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily refresh $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M IST')"
          git pull --rebase --autostash origin main || true
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble the public site (repo-only files excluded)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='_site' \
            --exclude='README.md' --exclude='data/lastmod.json' --exclude='data/refresh-log.json' \
            --exclude='data/pages-status.json' ./ _site/
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
